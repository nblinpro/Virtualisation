---
# =============================================================================
# Playbook : Deploiement des 2 DNS
# - dns-auth-01 : BIND9 autoritaire pour infra.lan
# - dns-rec-01  : AdGuard Home recursif + filtrage publicitaire
# =============================================================================

# IMPORTANT : on deploie l'autoritaire EN PREMIER
# Car le recursif (AdGuard) va le forwarder pour la zone infra.lan
- name: Configuration du DNS autoritaire (BIND9)
  hosts: dns_authoritative
  become: true
  gather_facts: true

  pre_tasks:
    - name: Attendre que le LXC soit accessible en SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: Mise a jour du cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - dns_bind9_auth

  post_tasks:
    - name: Verifier que BIND9 est actif
      ansible.builtin.command: systemctl is-active named
      register: bind_status
      changed_when: false

    - name: Tester resolution interne (pve-01.infra.lan)
      ansible.builtin.command: dig @127.0.0.1 +short pve-01.infra.lan
      register: dig_internal
      changed_when: false
      failed_when: false

    - name: Resume BIND9
      ansible.builtin.debug:
        msg:
          - "Statut BIND9    : {{ bind_status.stdout }}"
          - "pve-01.infra.lan: {{ dig_internal.stdout | default('echec') }}"

- name: Configuration du DNS recursif (AdGuard Home)
  hosts: dns_recursive
  become: true
  gather_facts: true

  pre_tasks:
    - name: Attendre que le LXC soit accessible en SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: Mise a jour du cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - dns_adguard_recursive

  post_tasks:
    - name: Attendre que AdGuard ecoute sur le port 53
      ansible.builtin.wait_for:
        port: 53
        timeout: 30

    - name: Verifier qu'AdGuard est actif
      ansible.builtin.command: systemctl is-active AdGuardHome
      register: adg_status
      changed_when: false

    - name: Tester resolution externe (google.com)
      ansible.builtin.command: dig @127.0.0.1 +short google.com
      register: dig_external
      changed_when: false
      failed_when: false

    - name: Tester resolution interne (forward vers BIND9)
      ansible.builtin.command: dig @127.0.0.1 +short pve-01.infra.lan
      register: dig_forward
      changed_when: false
      failed_when: false

    - name: Resume AdGuard
      ansible.builtin.debug:
        msg:
          - "Statut AdGuard       : {{ adg_status.stdout }}"
          - "google.com           : {{ 'OK' if dig_external.stdout else 'echec' }}"
          - "pve-01.infra.lan     : {{ dig_forward.stdout | default('echec') }}"
          - "----"
          - "UI AdGuard : http://10.0.20.10:3001"
          - "Login      : admin / Ynov2026!"
