---
# =============================================================================
# Role dns_bind9_auth - Installation et configuration de BIND9 autoritaire
# =============================================================================

- name: Installer BIND9 et utilitaires DNS
  ansible.builtin.apt:
    name:
      - bind9
      - bind9utils
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Desactiver systemd-resolved (conflit port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  failed_when: false

- name: Supprimer le lien /etc/resolv.conf si symbolique
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Recreer /etc/resolv.conf (pointage local + recursif pour Internet)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # BIND9 ne fait QUE l'autoritaire infra.lan
      # Pour les requetes Internet, on utilise le DNS recursif
      nameserver 10.0.20.10
      nameserver 1.1.1.1
      search infra.lan
    owner: root
    group: root
    mode: '0644'

- name: Deployer la configuration principale named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: '0644'
  notify: restart bind9

- name: Deployer la declaration de zone named.conf.local
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: '0644'
  notify: restart bind9

- name: Creer le repertoire des zones
  ansible.builtin.file:
    path: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: '0755'

- name: Deployer la zone forward {{ bind_zone }}
  ansible.builtin.template:
    src: zone-forward.j2
    dest: "/etc/bind/zones/db.{{ bind_zone }}"
    owner: root
    group: bind
    mode: '0644'
  notify: restart bind9

- name: Verifier la syntaxe de named.conf
  ansible.builtin.command: named-checkconf
  register: named_check
  changed_when: false

- name: Verifier la syntaxe de la zone
  ansible.builtin.command: "named-checkzone {{ bind_zone }} /etc/bind/zones/db.{{ bind_zone }}"
  register: zone_check
  changed_when: false

- name: Afficher le resultat de la verification de zone
  ansible.builtin.debug:
    msg: "{{ zone_check.stdout }}"

- name: Activer et demarrer BIND9
  ansible.builtin.systemd:
    name: named
    state: started
    enabled: true
    daemon_reload: true
