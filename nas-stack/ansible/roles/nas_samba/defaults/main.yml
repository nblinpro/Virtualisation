---
# =============================================================================
# Defaults - nas_samba v1.1
# Serveur de fichiers Samba pour le NAS (sans share backups)
# Les sauvegardes des VMs/CTs sont desormais gerees par PBS (pbs-01)
# =============================================================================

# Workgroup Windows
samba_workgroup: "YNOV"
samba_server_string: "NAS Ynov (Samba %v)"
samba_netbios_name: "NAS-YNOV"

# Repertoire racine des partages
samba_shares_root: "/srv/shares"

# Reseaux autorises (RFC 1918 internes)
samba_allowed_networks:
  - "10.0.0.0/8"
  - "192.168.0.0/16"
  - "127.0.0.0/8"

# Utilisateurs Samba (un seul user dans cette version)
samba_users:
  - { name: "ynov", password: "Ynov2026!", uid: 2001, gid: 2001, fullname: "Utilisateur Ynov" }

# Shares Samba (sans backups - PBS prend le relais)
samba_shares:
  - name: "public"
    comment: "Partage public - lecture seule"
    path: "/srv/shares/public"
    browsable: "yes"
    writable: "no"
    guest_ok: "yes"
    public: "yes"
    force_user: "nobody"
    force_group: "nogroup"
    create_mask: "0644"
    directory_mask: "0755"
    permissions: "0755"
    owner: "nobody"
    group: "nogroup"

  - name: "documents"
    comment: "Documents partages - lecture/ecriture authentifiee"
    path: "/srv/shares/documents"
    browsable: "yes"
    writable: "yes"
    guest_ok: "no"
    valid_users: "ynov"
    write_list: "ynov"
    create_mask: "0664"
    directory_mask: "0775"
    permissions: "2775"
    owner: "root"
    group: "samba-users"
