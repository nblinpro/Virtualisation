---
- name: "Deploiement du serveur de fichiers Samba (nas-01) v1.1"
  hosts: nas
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Attendre la connectivite SSH"
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: "Mise a jour APT"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - nas_samba

  post_tasks:
    - name: "Verifier statut smbd"
      ansible.builtin.command: systemctl is-active smbd
      register: smbd_status
      changed_when: false
      failed_when: false

    - name: "Resume final"
      ansible.builtin.debug:
        msg:
          - "==========================================="
          - "NAS Samba v1.1 deploye avec succes !"
          - "==========================================="
          - "Hostname  : nas-01"
          - "IP        : 10.0.99.10"
          - "VLAN      : 99 BACKUP"
          - "Status    : {{ smbd_status.stdout }}"
          - "-------------------------------------------"
          - "Shares    :"
          - "  - public     : lecture seule, invite"
          - "  - documents  : auth ynov / Ynov2026!"
          - "-------------------------------------------"
          - "Acces Windows : \\\\10.0.99.10\\public"
          - "Acces Linux   : smb://10.0.99.10/public"
          - "-------------------------------------------"
          - "Backups VMs/CTs : geres par pbs-01"
          - "==========================================="
