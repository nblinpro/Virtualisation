# =============================================================================
# Inventaire Ansible - Monitoring
# =============================================================================

# Serveur monitoring (Prometheus + Grafana + Loki + Promtail local)
[monitoring_server]
monitoring-01 ansible_host=10.0.60.10

# Cibles a scraper avec node_exporter
[node_exporter_targets]
dns-01     ansible_host=10.0.20.10
pgsql-01   ansible_host=10.0.50.10
web-01     ansible_host=10.0.40.11
web-02     ansible_host=10.0.40.12
web-03     ansible_host=10.0.40.13
lb-01      ansible_host=10.0.10.11
lb-02      ansible_host=10.0.10.12

# Hyperviseurs Proxmox (pve-exporter)
[pve_hosts]
pve-01 ansible_host=192.168.3.21
pve-02 ansible_host=192.168.3.22
pve-03 ansible_host=192.168.3.23

# Load-balancers HAProxy (exporter Prometheus :8404)
[haproxy_servers]
lb-01
lb-02

# Clients Promtail (envoient leurs logs a Loki)
[promtail_clients:children]
node_exporter_targets

# Groupe global
[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/proxmox_lab
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
